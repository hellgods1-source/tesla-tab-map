  <style>
    :root {

      --ink: #171A20;
      --body: #393C41;
      --muted: #5C5E62;
      --placeholder: #8E8E8E;
      --hairline: #EEEEEE;
      --border: #D0D1D2;
      --blue: #3E6AE1;

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {

    .app {

      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .map-pane {
      width: 100%;
      height: 42vh;
      min-height: 220px;
      flex: 0 0 42vh;
      background: var(--bg-soft);

    }

      width: 100%;
      height: 100%;

      }
      .copy-btn { display: inline-flex; align-items: center; justify-content: center; }

    header {
      flex: 0 0 auto;

    .search-wrap {

    #search, #placeSearch {

      background: var(--bg);
      color: var(--ink);
      padding: 0 12px;

    #placeBtn {

      border: 0;

      background: var(--ink);

</head>

      { id: "hyupsin-sasang", name: "협신 (부산 사상)", area: "부산 사상", sido: "부산", type: "tab", address: "부산 사상구 가야대로 180", phones: ["051-311-7300"], lat: 35.147062, lng: 128.991154 },

      { id: "s-gwangju", name: "S모터스 (광주)", area: "광주 광산", sido: "광주", type: "tab", address: "광주광역시 광산구 어등대로 605", phones: ["062-460-1100"], lat: 35.150099, lng: 126.79006 },
      { id: "js-daejeon", name: "JS모터스 (대전)", area: "대전 동구", sido: "대전", type: "tab", address: "대전 동구 새울로 58", phones: ["042-284-4974"], lat: 36.323955, lng: 127.460377 },
      { id: "cheonwoo-jeju", name: "천우 (제주)", area: "제주", sido: "제주", type: "tab", address: "제주시 연삼로 759", phones: ["064-805-5222"], lat: 33.519604, lng: 126.596332 }
    ];

    let userLatLng = null;
    let selectedId = null;
    let mapQuery = "대한민국";
    let mapZoom = 7;

    function googleEmbedSrc(query, zoom) {
      return "https://maps.google.com/maps?q=" + encodeURIComponent(query) +
        "&hl=ko&z=" + (zoom || 15) + "&output=embed";
    }

    function showMap(query, zoom) {
      mapQuery = query;
      mapZoom = zoom || 15;
      document.getElementById("mapFrame").src = googleEmbedSrc(mapQuery, mapZoom);
    }

    function haversineKm(aLat, aLng, bLat, bLng) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLng = (bLng - aLng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    function telHref(phone) {
      return "tel:" + phone.replace(/[^0-9+]/g, "");
    }

    function naverHref(shop) {
      return "https://map.naver.com/p/search/" + encodeURIComponent(shop.address);
    }

    function googleHref(shop) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(shop.name + " " + shop.address);
    }

    function formatKm(km) {
      if (km == null) return "";
      return km < 10 ? km.toFixed(1) + " km" : Math.round(km) + " km";
    }

    function withDistance(shops) {
      return shops.map((shop) => {
        const km = userLatLng ? haversineKm(userLatLng.lat, userLatLng.lng, shop.lat, shop.lng) : null;
        return Object.assign({}, shop, { km });
      });
    }

    function shopSearchHay(shop) {
      return (shop.name + shop.area + shop.address + shop.sido + (SIDO_LABEL[shop.sido] || "")).toLowerCase().replace(/\s+/g, "");
    }

    function filteredShops() {
      const q = (document.getElementById("search").value || "").trim().toLowerCase().replace(/\s+/g, "");
      let shops = withDistance(SHOPS);
      if (q) shops = shops.filter((s) => shopSearchHay(s).includes(q));
      return shops;
    }

    function sortShopsInSido(shops) {
      return shops.slice().sort((a, b) => {
        if (a.km != null && b.km != null) return a.km - b.km;
        if (a.type !== b.type) return a.type === "tesla" ? -1 : 1;
        return a.name.localeCompare(b.name, "ko");
      });
    }

    function groupedShops() {
      const shops = filteredShops();
      const bySido = {};
      shops.forEach((shop) => {
        if (!bySido[shop.sido]) bySido[shop.sido] = [];
        bySido[shop.sido].push(shop);
      });
      const keys = Object.keys(bySido);
      keys.sort((a, b) => {
        if (userLatLng) {
          const aMin = Math.min.apply(null, bySido[a].map((s) => s.km));
          const bMin = Math.min.apply(null, bySido[b].map((s) => s.km));
          return aMin - bMin;
        }
        return SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b);
      });
      return keys.map((sido) => ({
        sido,
        label: SIDO_LABEL[sido] || sido,
        shops: sortShopsInSido(bySido[sido])
      }));
    }

    function nearestFive() {
      if (!userLatLng) return [];
      return withDistance(SHOPS).sort((a, b) => a.km - b.km).slice(0, 5);
    }

    function typeLabel(type) {
      return type === "tesla" ? "직영" : "공인";
    }

    function shopCardHtml(shop) {
      return `
        <article class="shop-card${shop.id === selectedId ? " selected" : ""}" data-id="${shop.id}">
          <div class="shop-top">
            <div>
              <div class="shop-name">${shop.name}</div>
              <div class="shop-area">${shop.area}</div>
            </div>
            <span class="badge ${shop.type}">${typeLabel(shop.type)}</span>
          </div>
          <div class="shop-addr">${shop.address}</div>
          ${shop.km != null ? `<div class="shop-dist">약 ${formatKm(shop.km)}</div>` : ""}
          <div class="actions">
            <a class="btn-call" href="${telHref(shop.phones[0])}">전화</a>
            <a class="btn-gmap" href="${googleHref(shop)}" target="_blank" rel="noopener">구글맵</a>
            <a class="btn-naver" href="${naverHref(shop)}" target="_blank" rel="noopener">네이버</a>
          </div>
        </article>
      `;
    }

    function sidoCopyText(group) {
      const body = group.shops.map((shop) =>
        shop.name + "\n" + shop.address + "\n" + shop.phones.join(" / ")
      ).join("\n\n");
      return "[" + group.label + "]\n" + body;
    }

    function nearestCopyText(shops) {
      const body = shops.map((shop, i) =>
        (i + 1) + ". " + shop.name + " · 약 " + formatKm(shop.km) + "\n" +
        shop.address + "\n" + shop.phones.join(" / ")
      ).join("\n\n");
      return "가까운 Tesla 공인 바디샵\n\n" + body;
    }

    function focusSido(sido) {
      const shops = SHOPS.filter((s) => s.sido === sido);
      if (!shops.length) return;
      showMap(SIDO_LABEL[sido] + " " + shops[0].address, shops.length === 1 ? 15 : 11);
    }

    function copyText(text, btn, restoreLabel) {
      const done = () => {
        btn.textContent = "복사됨";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = restoreLabel;
          btn.classList.remove("copied");
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    function copySido(sido, btn) {
      const shops = sortShopsInSido(withDistance(SHOPS.filter((s) => s.sido === sido)));
      const group = { sido, label: SIDO_LABEL[sido] || sido, shops };
      copyText(sidoCopyText(group), btn, "문자 복사");
    }

    function renderNearest() {
      const panel = document.getElementById("nearestPanel");
      const shops = nearestFive();
      if (!shops.length) {
        panel.classList.remove("open");
        return;
      }
      panel.classList.add("open");
      document.getElementById("nearestList").innerHTML = shops.map(shopCardHtml).join("");
      document.getElementById("nearestList").querySelectorAll(".shop-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          selectShop(card.dataset.id, true);
        });
      });
    }

    function renderList() {
      const groups = groupedShops();
      const list = document.getElementById("list");
      const total = groups.reduce((n, g) => n + g.shops.length, 0);
      document.getElementById("listCount").textContent = total + "곳";
      renderNearest();
      if (!total) {
        list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }
      list.innerHTML = groups.map((group) => `
        <section class="sido-group" data-sido="${group.sido}">
          <div class="sido-head">
            <div class="sido-title">
              <strong>${group.label}</strong>
              <span>${group.shops.length}곳</span>
            </div>
            <button class="copy-btn" type="button" data-copy-sido="${group.sido}">문자 복사</button>
          </div>
          ${group.shops.map(shopCardHtml).join("")}
        </section>
      `).join("");
      list.querySelectorAll(".shop-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          selectShop(card.dataset.id, true);
        });
      });
      list.querySelectorAll(".sido-head").forEach((head) => {
        head.addEventListener("click", (e) => {
          if (e.target.closest(".copy-btn")) return;
          focusSido(head.parentElement.dataset.sido);
        });
      });
      list.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          copySido(btn.dataset.copySido, btn);
        });
      });
    }

    function selectShop(id, fromList) {
      selectedId = id;
      const shop = SHOPS.find((s) => s.id === id);
      if (!shop) return;
      showMap(shop.name + " " + shop.address, 16);
      renderList();
      if (fromList) return;
      const card = document.querySelector('.shop-card[data-id="' + id + '"]');
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function applyUserLocation(lat, lng, mapQ, hint) {
      userLatLng = { lat, lng };
      document.getElementById("locateBtn").classList.add("active");
      document.getElementById("locateBtn").textContent = "위치 켜짐";
      document.getElementById("sortHint").textContent = hint || "가까운 순으로 정렬됨";
      showMap(mapQ || (lat + "," + lng), 14);
      renderList();
    }

    function hideCandidates() {
      const box = document.getElementById("placeCandidates");
      box.classList.remove("open");
      box.innerHTML = "";
    }

    function candidateLabel(props) {
      const parts = [props.name, props.district, props.city, props.county, props.state].filter(Boolean);
      const unique = [];
      parts.forEach((p) => { if (unique.indexOf(p) === -1) unique.push(p); });
      return unique.join(" · ") || "위치";
    }

    function isKorea(props) {
      const c = (props && props.country) || "";
      const cc = (props && props.countrycode) || "";
      return c === "South Korea" || c === "대한민국" || cc === "KR" || cc === "kr";
    }

    function showCandidates(features) {
      const box = document.getElementById("placeCandidates");
      box.innerHTML = features.map((f, i) => {
        const label = candidateLabel(f.properties || {});
        const extra = [(f.properties || {}).street, (f.properties || {}).postcode].filter(Boolean).join(" ");
        return `<button class="place-candidate" type="button" data-i="${i}"><span>${label}</span>${extra ? "<small>" + extra + "</small>" : ""}</button>`;
      }).join("");
      box.classList.add("open");
      box.querySelectorAll(".place-candidate").forEach((btn) => {
        btn.addEventListener("click", () => {
          const f = features[Number(btn.dataset.i)];
          const lng = f.geometry.coordinates[0];
          const lat = f.geometry.coordinates[1];
          const q = candidateLabel(f.properties || {}) || (lat + "," + lng);
          hideCandidates();
          applyUserLocation(lat, lng, q, "입력 위치 기준 가까운 순");
        });
      });
    }

    document.getElementById("search").addEventListener("input", renderList);

    const locateBtn = document.getElementById("locateBtn");
    locateBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        document.getElementById("sortHint").textContent = "GPS를 쓸 수 없습니다. 주소로 찾아보세요.";
        return;
      }
      locateBtn.disabled = true;
      locateBtn.textContent = "확인 중…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locateBtn.disabled = false;
          applyUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.latitude + "," + pos.coords.longitude, "가까운 순으로 정렬됨");
        },
        () => {
          locateBtn.disabled = false;
          locateBtn.textContent = "내 위치";
          document.getElementById("sortHint").textContent = "위치 권한이 거부되었습니다. 주소로 찾아보세요.";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    });

    async function findPlace() {
      const q = (document.getElementById("placeSearch").value || "").trim();
      const placeBtn = document.getElementById("placeBtn");
      if (!q) {
        document.getElementById("sortHint").textContent = "주소나 지명을 입력하세요.";
        return;
      }
      placeBtn.disabled = true;
      placeBtn.textContent = "찾는 중…";
      hideCandidates();
      try {
        const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(q + " 대한민국") +
          "&lat=36.2&lon=127.9&limit=8&bbox=" + KOREA_BBOX;
        const res = await fetch(url);
        const data = await res.json();
        const features = ((data && data.features) || []).filter((f) => f.geometry && f.geometry.coordinates);
        const kr = features.filter((f) => isKorea(f.properties)).slice(0, 5);
        const picks = kr.length ? kr : features.slice(0, 5);
        if (!picks.length) {
          document.getElementById("sortHint").textContent = "위치를 찾지 못했습니다. 다른 지명을 입력하세요.";
          return;
        }
        showCandidates(picks);
        document.getElementById("sortHint").textContent = "검색 결과에서 위치를 선택하세요.";
      } catch (e) {
        document.getElementById("sortHint").textContent = "위치 검색에 실패했습니다. 잠시 후 다시 시도하세요.";
      } finally {
        placeBtn.disabled = false;
        placeBtn.textContent = "찾기";
      }
    }

    document.getElementById("placeBtn").addEventListener("click", findPlace);
    document.getElementById("placeSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        findPlace();
      }
    });
    document.getElementById("nearestCopyBtn").addEventListener("click", (e) => {
      const shops = nearestFive();
      if (!shops.length) return;
      copyText(nearestCopyText(shops), e.currentTarget, "문자 복사");
    });

    showMap("대한민국", 7);
    renderList();
  </script>
</body>
</html>
