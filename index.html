<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="Tesla 직영 사고수리센터 및 공인 바디샵을 지도에서 찾고, 가까운 센터를 선택하세요.">
  <title>Tesla 공인 바디샵 찾기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg: #FFFFFF;
      --bg-soft: #F4F4F4;
      --ink: #171A20;
      --body: #393C41;
      --muted: #5C5E62;
      --placeholder: #8E8E8E;
      --hairline: #EEEEEE;
      --border: #D0D1D2;
      --blue: #3E6AE1;
      --blue-hover: #3457c4;
      --radius: 4px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .app {
      height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #map {
      width: 100%;
      height: 42vh;
      min-height: 220px;
      flex: 0 0 42vh;
      background: var(--bg-soft);
    }
    .list-pane {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
      padding: 12px 16px calc(20px + var(--safe-bottom));
    }
    @media (min-width: 768px) {
      .stage {
        flex-direction: row;
        align-items: stretch;
      }
      #map {
        flex: 1 1 0;
        width: auto;
        height: auto;
        min-height: 0;
      }
      .list-pane {
        flex: 0 0 400px;
        width: 400px;
        max-width: 42vw;
        border-left: 1px solid var(--hairline);
      }
      .copy-btn { display: inline-flex; align-items: center; justify-content: center; }
    }
    header {
      flex: 0 0 auto;
      padding: calc(12px + var(--safe-top)) 16px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--hairline);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.2;
      color: var(--ink);
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }
    .locate-btn {
      flex: 0 0 auto;
      min-height: 40px;
      min-width: 88px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.33s;
    }
    .locate-btn:hover { background: var(--blue-hover); }
    .locate-btn:disabled { opacity: 0.65; cursor: wait; }
    .locate-btn.active { background: var(--ink); }
    .search-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    @media (min-width: 768px) {
      .search-wrap { grid-template-columns: 1fr 1fr auto; }
    }
    #search, #placeSearch {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
    }
    #search::placeholder, #placeSearch::placeholder { color: var(--placeholder); }
    #search:focus, #placeSearch:focus { outline: none; border-color: var(--blue); }
    .place-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    #placeBtn {
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    #placeBtn:disabled { opacity: 0.65; cursor: wait; }
    .leaflet-container { background: var(--bg-soft); font-family: inherit; height: 100%; }
    .leaflet-div-icon {
      background: transparent;
      border: none;
    }
    .list-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .sido-group { margin-bottom: 8px; }
    .sido-group + .sido-group { border-top: 1px solid var(--hairline); padding-top: 14px; }
    .sido-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 10px;
      padding: 4px 0;
      cursor: pointer;
    }
    .sido-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .sido-title strong { font-size: 16px; font-weight: 500; color: var(--ink); }
    .sido-title span { color: var(--muted); font-size: 13px; font-weight: 400; }
    .copy-btn {
      display: none;
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .copy-btn:hover { background: var(--blue-hover); }
    .copy-btn.copied { background: var(--ink); }
    .shop-card {
      display: grid;
      gap: 8px;
      padding: 14px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      background: var(--bg);
      cursor: pointer;
    }
    .shop-card.selected { border-color: var(--blue); }
    .shop-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .shop-name { font-weight: 500; font-size: 15px; line-height: 1.3; color: var(--ink); }
    .shop-area { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .badge {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: var(--radius);
    }
    .badge.tesla { background: #E8EEFB; color: var(--blue); }
    .badge.tab { background: var(--bg-soft); color: var(--muted); }
    .shop-addr { color: var(--body); font-size: 13px; line-height: 1.4; }
    .shop-dist { color: var(--blue); font-weight: 500; font-size: 13px; }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      border-radius: var(--radius);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-call { background: var(--blue); color: #fff; }
    .btn-naver, .btn-kakao {
      background: var(--bg-soft);
      color: var(--body);
      border: 1px solid var(--hairline);
    }
    .empty, .hint {
      padding: 18px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    footer.note {
      margin-top: 12px;
      padding: 12px 6px 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      border-top: 1px solid var(--hairline);
    }
    footer.note a { color: var(--body); }
    .pin {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #171A20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin span {
      transform: rotate(45deg);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
    }
    .pin.tesla { background: var(--blue); }
    .pin.tab { background: var(--ink); }
    .pin-wrap { width: 32px; height: 40px; }
    .pin-wrap.selected .pin {
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--blue);
    }
    .user-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--blue);
      border: 2px solid #fff;
      box-shadow: 0 0 0 6px rgba(62, 106, 225, 0.28);
    }
    .user-dot-wrap { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div>
          <h1>Tesla 공인 바디샵 찾기</h1>

    </div>

      { id: "hk-seocho", name: "HK모터스 (서울 서초)", area: "서울 서초", sido: "서울", type: "tab", address: "서울특별시 서초구 성촌4길 19", phones: ["02-579-6361"], lat: 37.466888, lng: 127.02215 },
      { id: "ym-hannam", name: "와이엠서비스 한남 (서울 용산)", area: "서울 용산", sido: "서울", type: "tab", address: "서울 용산구 한남대로21길 23", phones: ["02-790-1173"], lat: 37.533932, lng: 127.006494 },
      { id: "cheonwoo-ilsan", name: "천우 (고양 일산)", area: "경기 고양", sido: "경기", type: "tab", address: "경기도 고양시 일산동구 백마로 512", phones: ["031-961-0602"], lat: 37.662714, lng: 126.804924 },
      { id: "cheonwoo-bundang", name: "천우 (성남 분당)", area: "경기 성남 분당", sido: "경기", type: "tab", address: "경기도 성남시 분당구 대왕판교로 316 지하 2층", phones: ["031-715-4200"], lat: 37.371849, lng: 127.102143 },

      { id: "xile-bundang", name: "자일 서비스 (분당)", area: "경기 성남 분당", sido: "경기", type: "tab", address: "경기 성남시 분당구 대왕판교로 148", phones: ["031-780-6502"], lat: 37.392948, lng: 127.103886 },
      { id: "central-suwon", name: "센트럴모터스 (수원)", area: "경기 수원", sido: "경기", type: "tab", address: "경기 수원시 권선구 정조로 336", phones: ["031-292-1236"], lat: 37.237716, lng: 127.01785 },
      { id: "central-wonju", name: "센트럴모터스 (원주)", area: "강원 원주", sido: "강원", type: "tab", address: "강원도 원주시 정지길 3", phones: ["080-868-5100"], lat: 37.356496, lng: 127.949279 },
      { id: "hyupsin-sasang", name: "협신 (부산 사상)", area: "부산 사상", sido: "부산", type: "tab", address: "부산 사상구 가야대로 180", phones: ["051-311-7300"], lat: 35.15005, lng: 128.999322 },
      { id: "hyupsin-yeonje", name: "협신 (부산 연제)", area: "부산 수영", sido: "부산", type: "tab", address: "부산 수영구 좌수영로 210번길 18", phones: ["051-757-7310"], lat: 35.183579, lng: 129.115562 },
      { id: "sungjin-gimhae", name: "성진정비 (김해)", area: "경남 김해", sido: "경남", type: "tab", address: "경남 김해시 풍유동 1003-2", phones: ["055-716-8288"], lat: 35.21367, lng: 128.84709 },
      { id: "ym-daegu", name: "와이엠서비스 (대구)", area: "대구 달서", sido: "대구", type: "tab", address: "대구 달서구 성서4차첨단로 182", phones: ["053-580-7040"], lat: 35.82919, lng: 128.518434 },
      { id: "s-gwangju", name: "S모터스 (광주)", area: "광주 광산", sido: "광주", type: "tab", address: "광주광역시 광산구 어등대로 605", phones: ["062-460-1100"], lat: 35.142666, lng: 126.793098 },
      { id: "js-daejeon", name: "JS모터스 (대전)", area: "대전 동구", sido: "대전", type: "tab", address: "대전 동구 새울로 58", phones: ["042-284-4974"], lat: 36.320504, lng: 127.462393 },
      { id: "cheonwoo-jeju", name: "천우 (제주)", area: "제주", sido: "제주", type: "tab", address: "제주시 연삼로 759", phones: ["064-805-5222"], lat: 33.504136, lng: 126.550126 }
    ];

    const map = L.map("map", { zoomControl: true, attributionControl: true });
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap &copy; CARTO"
    }).addTo(map);

    const markers = {};
    let userLatLng = null;
    let selectedId = null;
    let userMarker = null;

    function pinIcon(type, selected) {
      const label = type === "tesla" ? "직" : "공";
      return L.divIcon({
        className: "pin-wrap" + (selected ? " selected" : ""),
        html: `<div class="pin ${type}"><span>${label}</span></div>`,
        iconSize: [32, 40],
        iconAnchor: [16, 38],
        popupAnchor: [0, -30]
      });
    }

    function userDotIcon() {
      return L.divIcon({
        className: "user-dot-wrap",
        html: '<div class="user-dot"></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });
    }

    function refreshPinSelection() {
      SHOPS.forEach((shop) => {
        const marker = markers[shop.id];
        if (marker) marker.setIcon(pinIcon(shop.type, shop.id === selectedId));
      });
    }

    function applyUserLocation(lat, lng, hint) {
      userLatLng = { lat, lng };
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([lat, lng], { icon: userDotIcon(), zIndexOffset: 1000 })
        .addTo(map)
        .bindPopup("내 위치");
      document.getElementById("locateBtn").classList.add("active");
      document.getElementById("locateBtn").textContent = "위치 켜짐";
      document.getElementById("sortHint").textContent = hint || "가까운 순으로 정렬됨";
      const nearest = withDistance(SHOPS).sort((a, b) => a.km - b.km)[0];
      map.fitBounds(L.latLngBounds([[lat, lng], [nearest.lat, nearest.lng]]).pad(0.35));
      renderList();
    }

    function haversineKm(aLat, aLng, bLat, bLng) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLng = (bLng - aLng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    function telHref(phone) {
      return "tel:" + phone.replace(/[^0-9+]/g, "");
    }

    function naverHref(shop) {
      return "https://map.naver.com/p/search/" + encodeURIComponent(shop.address);
    }

    function kakaoHref(shop) {
      return "https://map.kakao.com/link/to/" + encodeURIComponent(shop.name) + "," + shop.lat + "," + shop.lng;
    }

    function formatKm(km) {
      if (km == null) return "";
      return km < 10 ? km.toFixed(1) + " km" : Math.round(km) + " km";
    }

    function withDistance(shops) {
      return shops.map((shop) => {
        const km = userLatLng ? haversineKm(userLatLng.lat, userLatLng.lng, shop.lat, shop.lng) : null;
        return Object.assign({}, shop, { km });
      });
    }

    function shopSearchHay(shop) {
      return (shop.name + shop.area + shop.address + shop.sido + (SIDO_LABEL[shop.sido] || "")).toLowerCase().replace(/\s+/g, "");
    }

    function filteredShops() {
      const q = (document.getElementById("search").value || "").trim().toLowerCase().replace(/\s+/g, "");
      let shops = withDistance(SHOPS);
      if (q) shops = shops.filter((s) => shopSearchHay(s).includes(q));
      return shops;
    }

    function sortShopsInSido(shops) {
      return shops.slice().sort((a, b) => {
        if (a.km != null && b.km != null) return a.km - b.km;
        if (a.type !== b.type) return a.type === "tesla" ? -1 : 1;
        return a.name.localeCompare(b.name, "ko");
      });
    }

    function groupedShops() {
      const shops = filteredShops();
      const bySido = {};
      shops.forEach((shop) => {
        if (!bySido[shop.sido]) bySido[shop.sido] = [];
        bySido[shop.sido].push(shop);
      });
      const keys = Object.keys(bySido);
      keys.sort((a, b) => {
        if (userLatLng) {
          const aMin = Math.min.apply(null, bySido[a].map((s) => s.km));
          const bMin = Math.min.apply(null, bySido[b].map((s) => s.km));
          return aMin - bMin;
        }
        return SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b);
      });
      return keys.map((sido) => ({
        sido,
        label: SIDO_LABEL[sido] || sido,
        shops: sortShopsInSido(bySido[sido])
      }));
    }

    function typeLabel(type) {
      return type === "tesla" ? "직영" : "공인";
    }

    function shopCardHtml(shop) {
      return `
        <article class="shop-card${shop.id === selectedId ? " selected" : ""}" data-id="${shop.id}">
          <div class="shop-top">
            <div>
              <div class="shop-name">${shop.name}</div>
              <div class="shop-area">${shop.area}</div>
            </div>
            <span class="badge ${shop.type}">${typeLabel(shop.type)}</span>
          </div>
          <div class="shop-addr">${shop.address}</div>
          ${shop.km != null ? `<div class="shop-dist">약 ${formatKm(shop.km)}</div>` : ""}
          <div class="actions">
            <a class="btn-call" href="${telHref(shop.phones[0])}">전화</a>
            <a class="btn-naver" href="${naverHref(shop)}" target="_blank" rel="noopener">네이버</a>
            <a class="btn-kakao" href="${kakaoHref(shop)}" target="_blank" rel="noopener">카카오맵</a>
          </div>
        </article>
      `;
    }

    function sidoCopyText(group) {
      const body = group.shops.map((shop) =>
        shop.name + "\n" + shop.address + "\n" + shop.phones.join(" / ")
      ).join("\n\n");
      return "[" + group.label + "]\n" + body;
    }

    function focusSido(sido) {
      const shops = SHOPS.filter((s) => s.sido === sido);
      if (!shops.length) return;
      if (shops.length === 1) {
        map.setView([shops[0].lat, shops[0].lng], 12, { animate: true });
        return;
      }
      map.fitBounds(L.latLngBounds(shops.map((s) => [s.lat, s.lng])).pad(0.28));
    }

    function copySido(sido, btn) {
      const shops = sortShopsInSido(withDistance(SHOPS.filter((s) => s.sido === sido)));
      const group = { sido, label: SIDO_LABEL[sido] || sido, shops };
      const text = sidoCopyText(group);
      const done = () => {
        btn.textContent = "복사됨";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "문자 복사";
          btn.classList.remove("copied");
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    function renderList() {
      const groups = groupedShops();
      const list = document.getElementById("list");
      const total = groups.reduce((n, g) => n + g.shops.length, 0);
      document.getElementById("listCount").textContent = total + "곳";
      if (!total) {
        list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }
      list.innerHTML = groups.map((group) => `
        <section class="sido-group" data-sido="${group.sido}">
          <div class="sido-head">
            <div class="sido-title">
              <strong>${group.label}</strong>
              <span>${group.shops.length}곳</span>
            </div>
            <button class="copy-btn" type="button" data-copy-sido="${group.sido}">문자 복사</button>
          </div>
          ${group.shops.map(shopCardHtml).join("")}
        </section>
      `).join("");
      list.querySelectorAll(".shop-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          selectShop(card.dataset.id, true);
        });
      });
      list.querySelectorAll(".sido-head").forEach((head) => {
        head.addEventListener("click", (e) => {
          if (e.target.closest(".copy-btn")) return;
          focusSido(head.parentElement.dataset.sido);
        });
      });
      list.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          copySido(btn.dataset.copySido, btn);
        });
      });
    }

    function selectShop(id, fromList) {
      selectedId = id;
      const shop = SHOPS.find((s) => s.id === id);
      if (!shop) return;
      refreshPinSelection();
      const marker = markers[id];
      if (marker) {
        map.setView([shop.lat, shop.lng], Math.max(map.getZoom(), 13), { animate: true });
        marker.openPopup();
      }
      renderList();
      if (fromList) return;
      const card = document.querySelector('.shop-card[data-id="' + id + '"]');
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    SHOPS.forEach((shop) => {
      const marker = L.marker([shop.lat, shop.lng], { icon: pinIcon(shop.type, false) }).addTo(map);
      marker.bindPopup(
        `<strong>${shop.name}</strong><br>${shop.address}<br>` +
        `<a href="${telHref(shop.phones[0])}">${shop.phones[0]}</a>`
      );
      marker.on("click", () => selectShop(shop.id, false));
      markers[shop.id] = marker;
    });

    map.setView([36.2, 127.9], 7);
    requestAnimationFrame(() => map.invalidateSize());
    setTimeout(() => map.invalidateSize(), 120);
    window.addEventListener("resize", () => map.invalidateSize());

    document.getElementById("search").addEventListener("input", renderList);

    const locateBtn = document.getElementById("locateBtn");
    locateBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        document.getElementById("sortHint").textContent = "GPS를 쓸 수 없습니다. 주소로 찾아보세요.";
        return;
      }
      locateBtn.disabled = true;
      locateBtn.textContent = "확인 중…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locateBtn.disabled = false;
          applyUserLocation(pos.coords.latitude, pos.coords.longitude, "가까운 순으로 정렬됨");
        },
        () => {
          locateBtn.disabled = false;
          locateBtn.textContent = "내 위치";
          document.getElementById("sortHint").textContent = "위치 권한이 거부되었습니다. 주소로 찾아보세요.";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    });

    async function findPlace() {
      const q = (document.getElementById("placeSearch").value || "").trim();
      const placeBtn = document.getElementById("placeBtn");
      if (!q) {
        document.getElementById("sortHint").textContent = "주소나 지명을 입력하세요.";
        return;
      }
      placeBtn.disabled = true;
      placeBtn.textContent = "찾는 중…";
      try {
        const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(q) +
          "&lat=36.2&lon=127.9&limit=5";
        const res = await fetch(url);
        const data = await res.json();
        const features = (data && data.features) || [];
        const kr = features.find((f) => {
          const c = (f.properties && f.properties.country) || "";
          const cc = (f.properties && f.properties.countrycode) || "";
          return c === "South Korea" || c === "대한민국" || cc === "KR";
        }) || features[0];
        if (!kr || !kr.geometry || !kr.geometry.coordinates) {
          document.getElementById("sortHint").textContent = "위치를 찾지 못했습니다. 다른 지명을 입력하세요.";
          return;
        }
        const lng = kr.geometry.coordinates[0];
        const lat = kr.geometry.coordinates[1];
        applyUserLocation(lat, lng, "입력 위치 기준 가까운 순");
      } catch (e) {
        document.getElementById("sortHint").textContent = "위치 검색에 실패했습니다. 잠시 후 다시 시도하세요.";
      } finally {
        placeBtn.disabled = false;
        placeBtn.textContent = "찾기";
      }
    }

    document.getElementById("placeBtn").addEventListener("click", findPlace);
    document.getElementById("placeSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        findPlace();
      }
    });

    renderList();
  </script>
</body>
</html>
