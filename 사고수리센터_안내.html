      { id: "cheonwoo-jeju", name: "천우 (제주)", area: "제주", sido: "제주", type: "approved", address: "제주시 연삼로 759", phones: ["064-805-5222"], lat: 33.51205, lng: 126.56691 }

    let userLatLng = null;
    let selectedId = null;
    let map = null;
    let markersById = {};
    let userMarker = null;

    function haversineKm(aLat, aLng, bLat, bLng) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLng = (bLng - aLng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) *
        Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    function telHref(phone) {
      return "tel:" + phone.replace(/[^0-9+]/g, "");
    }

    function naverHref(shop) {
      return "https://map.naver.com/p/search/" + encodeURIComponent(shop.address);
    }

    function googleHref(shop) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(shop.name + " " + shop.address);
    }

    function formatKm(km) {
      if (km == null) return "";
      return km < 10 ? km.toFixed(1) + " km" : Math.round(km) + " km";
    }

    function typeLabel(type) {
      return TYPE_LABEL[type] || "공인";
    }

    function typeLabelForCopy(shop) {
      const label = typeLabel(shop.type);
      return shop.type === "tesla" ? label + " · 예약제" : label;
    }

    function withDistance(shops) {
      return shops.map((shop) => {
        const km = userLatLng ? haversineKm(userLatLng.lat, userLatLng.lng, shop.lat, shop.lng) : null;
        return Object.assign({}, shop, { km });
      });
    }

    function shopSearchHay(shop) {
      return (shop.name + shop.area + shop.address + shop.sido + (SIDO_LABEL[shop.sido] || "") + typeLabel(shop.type)).toLowerCase().replace(/\s+/g, "");
    }

    function filteredShops() {
      const q = (document.getElementById("search").value || "").trim().toLowerCase().replace(/\s+/g, "");
      let shops = withDistance(SHOPS);
      if (q) shops = shops.filter((s) => shopSearchHay(s).includes(q));
      return shops;
    }

    function sortByDistanceThenType(shops) {
      return shops.slice().sort((a, b) => {
        if (a.km != null && b.km != null && a.km !== b.km) return a.km - b.km;
        const ta = TYPE_RANK[a.type] != null ? TYPE_RANK[a.type] : 9;
        const tb = TYPE_RANK[b.type] != null ? TYPE_RANK[b.type] : 9;
        if (ta !== tb) return ta - tb;
        return a.name.localeCompare(b.name, "ko");
      });
    }

    function groupedShops() {
      const shops = filteredShops();
      const bySido = {};
      shops.forEach((shop) => {
        if (!bySido[shop.sido]) bySido[shop.sido] = [];
        bySido[shop.sido].push(shop);
      });
      const keys = Object.keys(bySido);
      keys.sort((a, b) => SIDO_ORDER.indexOf(a) - SIDO_ORDER.indexOf(b));
      return keys.map((sido) => ({
        sido,
        label: SIDO_LABEL[sido] || sido,
        shops: sortByDistanceThenType(bySido[sido])
      }));
    }

    function rankedShops() {
      return sortByDistanceThenType(filteredShops());
    }

    function towingBand(km) {
      if (km == null) return null;
      if (km <= TOW_BASIC_KM) return "basic";
      if (km <= TOW_EV_KM) return "ev";
      return "over";
    }

    function withinTowRange(shops) {
      return shops.filter((s) => s.km != null && s.km <= TOW_EV_KM);
    }

    function nearestFive() {
      if (!userLatLng) return [];
      return withinTowRange(rankedShops()).slice(0, 5);
    }

    function shopCardHtml(shop) {
      return `
        <article class="shop-card${shop.id === selectedId ? " selected" : ""}" data-id="${shop.id}">
          <div class="shop-top">
            <div>
              <div class="shop-name">${shop.name}</div>
              <div class="shop-area">${shop.area}</div>
            </div>
            <div class="shop-badges">
              <span class="badge ${shop.type}">${typeLabel(shop.type)}</span>
              ${shop.type === "tesla" ? '<span class="badge reservation">예약제</span>' : ""}
            </div>
          </div>
          <div class="shop-addr">${shop.address}</div>
          ${shop.km != null ? `<div class="shop-dist">약 ${formatKm(shop.km)}${towingBand(shop.km) ? `<span class="tow-tag ${towingBand(shop.km)}">${TOW_TAG[towingBand(shop.km)]}</span>` : ""}</div>` : ""}
          <div class="actions">
            <a class="btn-call" href="${telHref(shop.phones[0])}">전화</a>
            <a class="btn-gmap" href="${googleHref(shop)}" target="_blank" rel="noopener">구글맵</a>
            <a class="btn-naver" href="${naverHref(shop)}" target="_blank" rel="noopener">네이버</a>
          </div>
        </article>
      `;
    }

    function shopLine(shop, index) {
      const dist = shop.km != null ? " · 약 " + formatKm(shop.km) : "";
      const prefix = index != null ? (index + 1) + ". " : "";
      return prefix + shop.name + " (" + typeLabelForCopy(shop) + ")" + dist + "\n" +
        shop.address + "\n" + shop.phones.join(" / ");
    }

    function wrapSms(title, body) {
      return title + "\n\n" + body + "\n\n" + SMS_FOOTER;
    }

    function nearestCopyText(shops) {
      if (!shops.length) return wrapSms("가까운 Tesla 공인 바디샵", "100km 이내 센터 없음" + "\n\n" + TOW_NOTE);
      return wrapSms("가까운 Tesla 공인 바디샵", shops.map((shop, i) => shopLine(shop, i)).join("\n\n") + "\n\n" + TOW_NOTE);
    }

    function nationwideCopyText() {
      const shops = userLatLng ? rankedShops() : sortByDistanceThenType(withDistance(SHOPS));
      const title = userLatLng ? "전국 Tesla 공인 바디샵 (가까운 순)" : "전국 Tesla 공인 바디샵";
      return wrapSms(title, shops.map((shop, i) => shopLine(shop, i)).join("\n\n"));
    }

    function canUseLeaflet() {
      return typeof L !== "undefined";
    }

    function pinIcon(shop) {
      if (!canUseLeaflet()) return null;
      const selected = shop.id === selectedId ? " selected" : "";
      return L.divIcon({
        className: "leaflet-div-icon",
        html: '<div class="pin ' + shop.type + selected + '">' + (TYPE_PIN[shop.type] || "공") + "</div>",
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    function userIcon() {
      if (!canUseLeaflet()) return null;
      return L.divIcon({
        className: "leaflet-div-icon",
        html: '<div class="user-dot"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
    }

    function initMap() {
      const fallback = document.getElementById("mapFallback");
      if (!canUseLeaflet()) {
        if (fallback) fallback.classList.add("open");
        return;
      }
      if (fallback) fallback.classList.remove("open");
      map = L.map("map", { zoomControl: true, attributionControl: true }).setView([36.2, 127.9], 7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19
      }).addTo(map);
      SHOPS.forEach((shop) => {
        const marker = L.marker([shop.lat, shop.lng], { icon: pinIcon(shop), title: shop.name })
          .addTo(map)
          .bindPopup("<strong>" + shop.name + "</strong>" + shop.address + "<br>" + shop.phones.join(" / "));
        marker.on("click", () => selectShop(shop.id, false));
        markersById[shop.id] = marker;
      });
      setTimeout(() => map.invalidateSize(), 80);
    }

    function refreshPinIcons() {
      if (!canUseLeaflet()) return;
      SHOPS.forEach((shop) => {
        const marker = markersById[shop.id];
        if (marker) marker.setIcon(pinIcon(shop));
      });
    }

    function focusShopOnMap(shop, zoom) {
      if (!map) return;
      map.setView([shop.lat, shop.lng], zoom == null ? 15 : zoom);
      const marker = markersById[shop.id];
      if (marker) marker.openPopup();
    }

    function focusSido(sido) {
      const shops = SHOPS.filter((s) => s.sido === sido);
      if (!shops.length || !map) return;
      if (shops.length === 1) {
        focusShopOnMap(shops[0], 15);
        return;
      }
      if (!canUseLeaflet()) return;
      const bounds = L.latLngBounds(shops.map((s) => [s.lat, s.lng]));
      map.fitBounds(bounds, { padding: [28, 28], maxZoom: 12 });
    }

    function showUserOnMap(lat, lng, zoom) {
      if (!map) return;
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([lat, lng], { icon: userIcon(), zIndexOffset: 600, title: "고객 위치" }).addTo(map);
      map.setView([lat, lng], zoom == null ? 11 : zoom);
    }

    function copyText(text, btn, restoreLabel) {
      const done = () => {
        btn.textContent = "복사됨";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = restoreLabel;
          btn.classList.remove("copied");
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }

    function bindCardEvents(root) {
      root.querySelectorAll(".shop-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("a") || e.target.closest("button")) return;
          selectShop(card.dataset.id, true);
        });
      });
    }

    function renderNearest() {
      const panel = document.getElementById("nearestPanel");
      const copyBtn = document.getElementById("nearestCopyBtn");
      const shops = nearestFive();
      if (!shops.length) {
        panel.classList.remove("open");
        if (copyBtn) copyBtn.classList.remove("open");
        return;
      }
      panel.classList.add("open");
      if (copyBtn) copyBtn.classList.add("open");
      document.getElementById("nearestList").innerHTML = shops.map(shopCardHtml).join("");
      bindCardEvents(document.getElementById("nearestList"));
    }

    function renderList() {
      const list = document.getElementById("list");
      const visible = filteredShops();
      document.getElementById("listCount").textContent = visible.length + "곳 · 데이터 " + DATA_AS_OF;
      renderNearest();
      if (!visible.length) {
        list.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }
      if (userLatLng) {
        list.innerHTML = nearestFive().length
          ? ""
          : '<div class="hint">100km 이내 센터가 없습니다. 전국 복사를 이용해 주세요.</div>';
        return;
      }
      const groups = groupedShops();
      list.innerHTML = groups.map((group) => `
        <section class="sido-group" data-sido="${group.sido}">
          <div class="sido-head">
            <div class="sido-title">
              <strong>${group.label}</strong>
              <span>${group.shops.length}곳</span>
            </div>
          </div>
          ${group.shops.map(shopCardHtml).join("")}
        </section>
      `).join("");
      bindCardEvents(list);
      list.querySelectorAll(".sido-head").forEach((head) => {
        head.addEventListener("click", () => {
          focusSido(head.parentElement.dataset.sido);
        });
      });
    }

    function selectShop(id, fromList) {
      selectedId = id;
      const shop = SHOPS.find((s) => s.id === id);
      if (!shop) return;
      refreshPinIcons();
      focusShopOnMap(shop, 15);
      renderList();
      if (fromList) return;
      const card = document.querySelector('.shop-card[data-id="' + id + '"]');
      if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function canUseGeolocation() {
      return !!(navigator.geolocation && window.isSecureContext);
    }

    function focusPlaceSearch() {
      const input = document.getElementById("placeSearch");
      if (input) input.focus();
    }

    function setLocateUnavailable(hint) {
      const btn = document.getElementById("locateBtn");
      btn.disabled = true;
      btn.classList.add("unavailable");
      btn.classList.remove("active");
      btn.textContent = "내 위치";
      if (!userLatLng) document.getElementById("sortHint").textContent = hint;
    }

    function syncLocateAvailability() {
      if (!canUseGeolocation()) {
        setLocateUnavailable("주소로 고객 위치를 입력하세요");
        return;
      }
      if (!navigator.permissions || !navigator.permissions.query) return;
      navigator.permissions.query({ name: "geolocation" }).then((status) => {
        const apply = () => {
          if (status.state === "denied") {
            setLocateUnavailable("위치 권한 없이 주소로 찾을 수 있습니다");
            return;
          }
          if (userLatLng) return;
          const btn = document.getElementById("locateBtn");
          btn.disabled = false;
          btn.classList.remove("unavailable");
          btn.textContent = "내 위치";
        };
        apply();
        status.onchange = apply;
      }).catch(() => {});
    }

    function applyUserLocation(lat, lng, hint) {
      userLatLng = { lat, lng };
      const btn = document.getElementById("locateBtn");
      btn.classList.add("active");
      btn.textContent = "위치 켜짐";
      if (canUseGeolocation() && !btn.classList.contains("unavailable")) btn.disabled = false;
      document.getElementById("sortHint").textContent = hint || "가까운 순으로 정렬됨";
      showUserOnMap(lat, lng, 11);
      renderList();
    }

    function hideCandidates() {
      const box = document.getElementById("placeCandidates");
      box.classList.remove("open");
      box.innerHTML = "";
    }

    function candidateLabel(props) {
      const parts = [props.name, props.district, props.city, props.county, props.state].filter(Boolean);
      const unique = [];
      parts.forEach((p) => { if (unique.indexOf(p) === -1) unique.push(p); });
      return unique.join(" · ") || "위치";
    }

    function isKorea(props) {
      const c = (props && props.country) || "";
      const cc = (props && props.countrycode) || "";
      return c === "South Korea" || c === "대한민국" || cc === "KR" || cc === "kr";
    }

    function showCandidates(features) {
      const box = document.getElementById("placeCandidates");
      box.innerHTML = features.map((f, i) => {
        const label = candidateLabel(f.properties || {});
        const extra = [(f.properties || {}).street, (f.properties || {}).postcode].filter(Boolean).join(" ");
        return `<button class="place-candidate" type="button" data-i="${i}"><span>${label}</span>${extra ? "<small>" + extra + "</small>" : ""}</button>`;
      }).join("");
      box.classList.add("open");
      box.querySelectorAll(".place-candidate").forEach((btn) => {
        btn.addEventListener("click", () => {
          const f = features[Number(btn.dataset.i)];
          const lng = f.geometry.coordinates[0];
          const lat = f.geometry.coordinates[1];
          hideCandidates();
          applyUserLocation(lat, lng, "입력 위치 기준 가까운 순");
        });
      });
    }

    document.getElementById("search").addEventListener("input", renderList);

    const locateBtn = document.getElementById("locateBtn");
    locateBtn.addEventListener("click", () => {
      if (!canUseGeolocation() || locateBtn.classList.contains("unavailable")) {
        setLocateUnavailable(canUseGeolocation()
          ? "위치 권한 없이 주소로 찾을 수 있습니다"
          : "주소로 고객 위치를 입력하세요");
        focusPlaceSearch();
        return;
      }
      locateBtn.disabled = true;
      locateBtn.textContent = "확인 중…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locateBtn.disabled = false;
          locateBtn.classList.remove("unavailable");
          applyUserLocation(pos.coords.latitude, pos.coords.longitude, "가까운 순으로 정렬됨");
        },
        () => {
          setLocateUnavailable("위치 권한 없이 주소로 찾을 수 있습니다");
          focusPlaceSearch();
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    });

    async function findPlace() {
      const q = (document.getElementById("placeSearch").value || "").trim();
      const placeBtn = document.getElementById("placeBtn");
      if (!q) {
        document.getElementById("sortHint").textContent = "주소나 지명을 입력하세요.";
        return;
      }
      placeBtn.disabled = true;
      placeBtn.textContent = "찾는 중…";
      hideCandidates();
      try {
        const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(q + " 대한민국") +
          "&lat=36.2&lon=127.9&limit=8&bbox=" + KOREA_BBOX;
        const res = await fetch(url);
        const data = await res.json();
        const features = ((data && data.features) || []).filter((f) => f.geometry && f.geometry.coordinates);
        const kr = features.filter((f) => isKorea(f.properties)).slice(0, 5);
        const picks = kr.length ? kr : features.slice(0, 5);
        if (!picks.length) {
          document.getElementById("sortHint").textContent = "위치를 찾지 못했습니다. 다른 지명을 입력하세요.";
          return;
        }
        showCandidates(picks);
        document.getElementById("sortHint").textContent = "검색 결과에서 위치를 선택하세요.";
      } catch (e) {
        document.getElementById("sortHint").textContent = "위치 검색에 실패했습니다. 주소만으로도 센터 목록은 복사할 수 있습니다.";
      } finally {
        placeBtn.disabled = false;
        placeBtn.textContent = "찾기";
      }
    }

    document.getElementById("placeBtn").addEventListener("click", findPlace);
    document.getElementById("placeSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        findPlace();
      }
    });
    document.getElementById("nearestCopyBtn").addEventListener("click", (e) => {
      const shops = nearestFive();
      if (!shops.length) return;
      copyText(nearestCopyText(shops), e.currentTarget, "근처 복사");
    });
    document.getElementById("allCopyBtn").addEventListener("click", (e) => {
      copyText(nationwideCopyText(), e.currentTarget, "전국 복사");
    });

    window.addEventListener("resize", () => {
      if (map) map.invalidateSize();
    });

    function applyVersionChrome() {
      const latest = CHANGELOG[0];
      document.getElementById("brandSub").textContent =
        "FOH 고객응대 · 직영 · 추천 · 공인 · 버전 " + APP_VERSION;
      document.getElementById("changelogLine").textContent =
        latest ? latest.date + " · " + latest.note : DATA_AS_OF;
    }

    initMap();
    applyVersionChrome();
    renderList();
    syncLocateAvailability();
  </script>
</body>
</html>
